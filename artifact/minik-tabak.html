; donmuş yoğurt damlaları.`,"12+":`Her gün; meyveli yoğurtlar yerine sade + taze meyve.`},note:`Türkiye'de geleneksel ilk besinlerden. Hazır meyveli yoğurtlar genellikle şeker içerir.`},{id:`peynir-lor`,name:`Lor / tuzsuz beyaz peynir`,emoji:`🧀`,category:`sut`,minAgeMonths:7,allergen:`sut`,nutrients:[`kalsiyum`,`protein`],choking:`dusuk`,serving:{"6-8":`Tuzsuz lor ezilmiş, sebze püresine karıştırılmış.`,"9-11":`Lor, tuzsuz/az tuzlu peynir — tuzunu suda bekleterek azaltın.`,"12+":`Az tuzlu beyaz peynir; kaşar ince rendelenmiş.`},note:`Klasik beyaz peynir çok tuzludur. 1 yaş altında tuz ihtiyacı < 1 g/gün.`},{id:`inek-sutu`,name:`İnek sütü`,emoji:`🥛`,category:`sut`,minAgeMonths:12,allergen:`sut`,nutrients:[`kalsiyum`,`protein`],choking:`dusuk`,serving:{"6-8":`Ana içecek olarak verilmez; pişirmede (lapa, muhallebi) az miktar kullanılabilir.`,"9-11":`Yine yalnızca pişirmede.`,"12+":`Tam yağlı, açık bardaktan; günde ~400–500 ml'yi aşmayın.`},note:`12 aydan önce içecek olarak inek sütü bağırsak kanamasına ve demir eksikliğine yol açabilir (CDC).`},{id:`tereyagi`,name:`Tereyağı`,emoji:`🧈`,category:`sut`,minAgeMonths:6,allergen:`sut`,nutrients:[`enerji`,`avit`],choking:`dusuk`,serving:{"6-8":`Tuzsuz tereyağı, sebze püresine küçük bir parça.`,"9-11":`Yemeklerde az miktar.`,"12+":`Az miktar.`}},{id:`yulaf`,name:`Yulaf`,emoji:`🌾`,category:`tahil`,minAgeMonths:6,nutrients:[`lif`,`demir`,`enerji`],choking:`dusuk`,serving:{"6-8":`İnce öğütülmüş yulaf lapası (anne sütü/mama veya suyla pişmiş).`,"9-11":`Normal yulaf lapası, şekersiz yulaf pankeki.`,"12+":`Yulaf lapası, muffin, köfte bağlayıcısı.`},note:`Saf yulaf glutensizdir ama genellikle buğdayla çapraz bulaşıktır.`},{id:`bulgur`,name:`Bulgur`,emoji:`🌾`,category:`tahil`,minAgeMonths:7,allergen:`bugday`,nutrients:[`lif`,`demir`,`enerji`],choking:`dusuk`,serving:{"6-8":`İnce (köftelik) bulgur, çorbada iyice pişmiş.`,"9-11":`Sebzeli bulgur pilavı (yumuşak pişmiş).`,"12+":`Aile pilavı, kısır (az baharatlı).`},note:`Pirince göre daha fazla lif ve daha az arsenik — harika bir alternatif.`},{id:`pirinc`,name:`Pirinç`,emoji:`🍚`,category:`tahil`,minAgeMonths:6,nutrients:[`enerji`],choking:`dusuk`,serving:{"6-8":`Bol suda pişirilip suyu dökülmüş, lapa veya püre içinde.`,"9-11":`Yumuşak pilav, sütlaç (şekersiz).`,"12+":`Pilav.`},note:`Arsenik birikimi nedeniyle tek tahıl olarak kullanmayın; yulaf, bulgur, karabuğday ile dönüşümlü verin. Pirinç sütü 5 yaş altına önerilmez (NHS).`},{id:`makarna`,name:`Makarna / şehriye`,emoji:`🍝`,category:`tahil`,minAgeMonths:7,allergen:`bugday`,nutrients:[`enerji`],choking:`dusuk`,serving:{"6-8":`Burgu veya kalem makarna iyice pişmiş (kavraması kolay).`,"9-11":`Küçük makarna, arpa şehriye.`,"12+":`Aile makarnaları.`}},{id:`ekmek`,name:`Tam buğday ekmeği`,emoji:`🍞`,category:`tahil`,minAgeMonths:7,allergen:`bugday`,nutrients:[`lif`,`enerji`],choking:`orta`,serving:{"6-8":`Hafifçe kızartılmış parmak şeritleri, üzerine ezme sürülmüş.`,"9-11":`Küçük parçalar.`,"12+":`Dilimler.`},note:`Yumuşak beyaz ekmek ağızda hamurlaşıp topaklanabilir; hafif kızartmak riski azaltır.`},{id:`irmik`,name:`İrmik`,emoji:`🌾`,category:`tahil`,minAgeMonths:7,allergen:`bugday`,nutrients:[`enerji`],choking:`dusuk`,serving:{"6-8":`Şekersiz irmik lapası (meyveyle tatlandırılmış).`,"9-11":`İrmik lapası, sebzeli.`,"12+":`Şekersiz irmik tatlısı.`}},{id:`karabugday`,name:`Karabuğday`,emoji:`🌾`,category:`tahil`,minAgeMonths:6,nutrients:[`lif`,`demir`,`protein`],choking:`dusuk`,serving:{"6-8":`Lapa veya un olarak pankek.`,"9-11":`Pilav, lapa.`,"12+":`Pilav, salata.`},note:`Adına rağmen buğday değildir; glutensizdir.`},{id:`kirmizi-mercimek`,name:`Kırmızı mercimek`,emoji:`🫘`,category:`bakliyat`,minAgeMonths:6,nutrients:[`demir`,`protein`,`lif`],choking:`dusuk`,serving:{"6-8":`Havuç/patatesle pişirilip püre (bebek mercimek çorbası).`,"9-11":`Pütürlü çorba, mercimek köftesi (az baharatlı).`,"12+":`Aile çorbası, az tuzlu.`},note:`Bitkisel demir kaynağı — limon/domates gibi C vitaminiyle birlikte verin.`},{id:`nohut`,name:`Nohut`,emoji:`🧆`,category:`bakliyat`,minAgeMonths:7,nutrients:[`demir`,`protein`,`lif`],choking:`yuksek`,serving:{"6-8":`Kabukları soyulup tamamen püre (bebek humusu).`,"9-11":`Çatalla iyice ezilmiş; bütün nohut yok.`,"12+":`Ezilmiş veya yarıya bölünmüş yumuşak nohut.`},note:`Bütün nohut tanesi küçük çocuklarda boğulma riskidir.`},{id:`yesil-mercimek`,name:`Yeşil mercimek`,emoji:`🫘`,category:`bakliyat`,minAgeMonths:7,nutrients:[`demir`,`protein`,`lif`],choking:`dusuk`,serving:{"6-8":`İyice pişip ezilmiş.`,"9-11":`Sebzeli yemekte yumuşak taneler.`,"12+":`Aile yemeği.`}},{id:`kuru-fasulye`,name:`Kuru fasulye`,emoji:`🫘`,category:`bakliyat`,minAgeMonths:8,nutrients:[`demir`,`protein`,`lif`],choking:`orta`,serving:{"6-8":`Kabukları soyulup püre, az miktarda (gaz yapabilir).`,"9-11":`Çatalla ezilmiş.`,"12+":`Ezilmiş veya yumuşak taneler.`}},{id:`zeytinyagi`,name:`Zeytinyağı`,emoji:`🫒`,category:`yag`,minAgeMonths:6,nutrients:[`enerji`],choking:`dusuk`,serving:{"6-8":`Her püreye ½–1 çay kaşığı sızma zeytinyağı.`,"9-11":`Yemeklerde.`,"12+":`Yemeklerde, salatalarda.`},note:`Bebek beslenmesinde yağ kısıtlanmaz — beyin gelişimi için önemli enerji kaynağı.`},{id:`tahin`,name:`Tahin`,emoji:`🥄`,category:`yag`,minAgeMonths:6,allergen:`susam`,nutrients:[`kalsiyum`,`demir`,`enerji`],choking:`orta`,serving:{"6-8":`İnce bir tabaka veya püre/yoğurda karıştırılmış (kaşıktan kalın top halinde değil).`,"9-11":`Humus, tahinli yoğurt, ekmeğe ince sürülmüş.`,"12+":`Ekmeğe sürülmüş; pekmezle karıştırmadan.`},note:`Susam alerjenini tanıştırmanın en kolay yolu.`},{id:`fistik-ezmesi`,name:`Fıstık ezmesi (sade)`,emoji:`🥜`,category:`yag`,minAgeMonths:6,allergen:`yerfistigi`,nutrients:[`protein`,`enerji`],choking:`yuksek`,serving:{"6-8":`Sulandırılmış veya püreye karıştırılmış; asla kaşıktan kalın topak halinde.`,"9-11":`Kızarmış ekmek şeridine çok ince sürülmüş.`,"12+":`İnce sürülmüş; bütün fıstık 5 yaşına kadar yok.`},note:`Erken tanıştırma yer fıstığı alerjisi riskini anlamlı ölçüde azaltır (LEAP çalışması, NIAID).`},{id:`ceviz`,name:`Ceviz / badem / fındık`,emoji:`🌰`,category:`yag`,minAgeMonths:6,allergen:`agacyemisi`,nutrients:[`omega3`,`enerji`,`protein`],choking:`yuksek`,serving:{"6-8":`Un gibi öğütülmüş, lapaya/yoğurda serpilmiş.`,"9-11":`Öğütülmüş veya ince ezme olarak.`,"12+":`Öğütülmüş/ezme. Bütün veya iri parça yemiş 5 yaşına kadar yok.`}}],Object.fromEntries(Dt.map(e=>[e.id,e]))})),kt,At,jt=t((()=>{kt=[{id:`t-hazir-1`,fromMonths:0,toMonths:6,category:`gelisim`,title:`Hazırlık işaretleri`,body:`Ek gıdaya hazır olan bebek: az destekle dik oturur, başını sabit tutar, yiyeceği görüp ağzına götürür ve dil itme refleksi azalmıştır. Ellerini emmek veya geceleri sık uyanmak tek başına hazırlık işareti değildir.`,source:`nhs`},{id:`t-hazir-2`,fromMonths:0,toMonths:6,category:`beslenme`,title:`4 aydan önce asla`,body:`Ek gıdaya 4. aydan (17 hafta) önce başlanmamalı, 6. aydan sonraya da ertelenmemelidir. İdeal olan yaklaşık 6. ay civarıdır.`,source:`espghan`},{id:`t-hazir-3`,fromMonths:0,toMonths:6,category:`taktik`,title:`Sofraya şimdiden katın`,body:`Yemek saatlerinde bebeğinizi kucağınıza alın. Sizi yerken izlemek, çatal-kaşık seslerini duymak ve kokuları almak ek gıdaya güzel bir hazırlıktır.`},{id:`t-hazir-4`,fromMonths:0,toMonths:6,category:`guvenlik`,title:`D vitamini desteği`,body:`İlk yıl boyunca çocuk doktorunuzun önerdiği D vitamini desteğini her gün verin. Sağlık Bakanlığı programıyla bu destek 1 yaşına kadar ücretsizdir.`,source:`saglikbak`},{id:`t-hazir-5`,fromMonths:0,toMonths:6,category:`taktik`,title:`Alışveriş listesi`,body:`Mama sandalyesi (ayak desteği olan!), yumuşak silikon kaşık, açık bardak, önlük ve yere serilecek bir örtü — ihtiyacınız olan bu kadar. Pahalı bebek robotları şart değil.`},{id:`t-ilk-1`,fromMonths:6,toMonths:7,category:`beslenme`,title:`Demir öncelikli başlayın`,body:`Doğumla gelen demir depoları 6. ayda azalmaya başlar. İlk haftalardan itibaren et, tavuk, mercimek, yumurta gibi demir kaynaklarını menüye alın.`,source:`who2023`},{id:`t-ilk-2`,fromMonths:6,toMonths:7,category:`taktik`,title:`Önce süt, sonra kaşık`,body:`İlk haftalarda bebek çok aç ya da çok yorgunken yeni şeyler denemek zordur. Emzirdikten/mamadan yaklaşık 1 saat sonra, keyifli olduğu bir saat seçin.`},{id:`t-ilk-3`,fromMonths:6,toMonths:7,category:`guvenlik`,title:`Öğürme ≠ boğulma`,body:`Öğürme gürültülüdür: öksürür, yüzünü buruşturur, dilini çıkarır. Bu, bebeğinizin doğal koruma refleksidir — sakin kalın, müdahale etmeyin. Boğulma sessizdir: ses çıkaramaz, morarır. Bu durumda hemen ilk yardım uygulayın.`},{id:`t-ilk-4`,fromMonths:6,toMonths:7,category:`beslenme`,title:`Sebzeyle başlayın, tekrarlayın`,body:`Acımsı yeşil sebzeler (brokoli, kabak, bezelye) meyvelerden önce ve sık sunulduğunda bebekler sebzeyi daha kolay kabul ediyor.`,source:`espghan`},{id:`t-ilk-5`,fromMonths:6,toMonths:7,category:`guvenlik`,title:`Tuz, şeker, bal yok`,body:`1 yaş altında yemeğe tuz ve şeker eklemeyin. Bal, bebek botulizmi riski nedeniyle 12. aydan önce hiçbir şekilde (pişmiş olsa bile) verilmez.`,source:`cdc`},{id:`t-ilk-6`,fromMonths:6,toMonths:7,category:`taktik`,title:`Önceden yüklenmiş kaşık`,body:`Kaşığı püreyle doldurup bebeğe uzatın, kendisi tutup ağzına götürsün. Hem kontrol onda olur hem de kaşıkla BLW'nin en güzel ortak noktası budur.`},{id:`t-ilk-7`,fromMonths:6,toMonths:7,category:`guvenlik`,title:`Dik oturuş`,body:`Bebek her zaman dik (90°) oturmalı, ayakları desteklenmeli. Ana kucağında yatar pozisyonda, araba koltuğunda veya oyun oynarken asla yemek vermeyin.`},{id:`t-ilk-8`,fromMonths:6,toMonths:8,category:`beslenme`,title:`Alerjenler: erken ve tek tek`,body:`Yumurta, yer fıstığı, süt, susam, buğday, balık gibi alerjenleri 6. aydan itibaren birer birer tanıştırın. Erken tanıştırmak alerji riskini azaltabilir; ertelemenin faydası gösterilmemiştir.`,source:`aap`},{id:`t-ilk-9`,fromMonths:6,toMonths:8,category:`taktik`,title:`Parmak kuralı`,body:`BLW'de besinler bebeğin avucunu kapattığında iki yandan taşacak uzunlukta (≈ yetişkin parmağı) ve iki parmağınız arasında bastırınca ezilecek yumuşaklıkta olmalı.`,source:`bliss`},{id:`t-ilk-10`,fromMonths:6,toMonths:12,category:`beslenme`,title:`Su zamanı`,body:`Öğünlerle birlikte açık bardaktan veya pipetli bardaktan birkaç yudum su sunun. 6–12 ay için günde yaklaşık 120–240 ml yeterlidir; fazlası süt alımını azaltabilir.`,source:`aap`},{id:`t-kesif-1`,fromMonths:7,toMonths:9,category:`gelisim`,title:`Pütürlüye geçiş penceresi`,body:`Pütürlü dokulara 9. aydan önce geçmek önemlidir. Uzun süre pürüzsüz püreyle beslenen bebeklerde ileride seçici yeme ve doku reddi daha sık görülür.`,source:`nhs`},{id:`t-kesif-2`,fromMonths:7,toMonths:9,category:`beslenme`,title:`Demir + C vitamini`,body:`Mercimek, nohut, ıspanak gibi bitkisel demir kaynaklarını domates, kırmızı biber, portakal veya limonla aynı öğünde verin; emilim belirgin şekilde artar.`},{id:`t-kesif-3`,fromMonths:7,toMonths:9,category:`taktik`,title:`8–15 deneme kuralı`,body:`Bebeğiniz bir besini reddettiyse bu 'sevmiyor' demek değildir. Bir besinin kabulü için 8–15 kez sakin ve baskısız sunmak gerekebilir. Tabağa koymak bile bir denemedir.`},{id:`t-kesif-4`,fromMonths:7,toMonths:12,category:`guvenlik`,title:`Boğulma riski yüksek besinler`,body:`Bütün üzüm, çeri domates, bütün yemiş (fındık, fıstık), patlamış mısır, çiğ havuç/elma, sert şekerler ve sosis 4–5 yaşına kadar ya hiç verilmez ya da uygun şekilde kesilir.`,source:`cdc`},{id:`t-kesif-5`,fromMonths:7,toMonths:9,category:`taktik`,title:`Batch cooking`,body:`Haftada bir gün 3–4 püre/köfte hazırlayıp buz kalıplarında dondurun. Her küp ≈ 1–2 yemek kaşığı; karıştırarak her gün yeni kombinasyonlar yaratırsınız.`},{id:`t-kesif-6`,fromMonths:7,toMonths:12,category:`mit`,title:`Pekmez demir deposu mu?`,body:`Pekmezin demiri sanıldığı kadar yüksek değildir ve vücut tarafından iyi emilmez; buna karşılık yoğun şeker içerir. 1 yaş altında önermiyoruz. Demir için et, yumurta, mercimek daha etkilidir.`},{id:`t-kesif-7`,fromMonths:7,toMonths:12,category:`beslenme`,title:`Hayvansal gıda her gün`,body:`WHO 2023 rehberi her gün et, balık veya yumurta tüketilmesini öneriyor. Küçük porsiyonlar bile (1–2 yemek kaşığı) demir, çinko ve B12 için büyük fark yaratır.`,source:`who2023`},{id:`t-kesif-8`,fromMonths:7,toMonths:12,category:`guvenlik`,title:`Saklama kuralları`,body:`Ev yapımı püreler buzdolabında 24–48 saat (et/balık/yumurta 24 saat), derin dondurucuda 1 ay. Buzdolabında çözdürün, bir kez buharı tütene kadar ısıtın, soğutup verin. Artanı atın; tekrar dondurmayın.`},{id:`t-kesif-9`,fromMonths:7,toMonths:9,category:`taktik`,title:`Kavanozdan değil, kaseden`,body:`Bebeği doğrudan saklama kabından beslemeyin; kaşıkla bulaşan tükürük kalan yemekte bakteri üremesini hızlandırır. Porsiyonu kaseye alın.`},{id:`t-pratik-1`,fromMonths:9,toMonths:12,category:`gelisim`,title:`Kıskaç kavrama`,body:`Başparmak ve işaret parmağıyla küçük şeyleri tutma becerisi bu aylarda gelişir. Nohut büyüklüğünde yumuşak lokmalar (ezilmiş bezelye, yoğurt damlası, küçük köfte parçaları) mükemmel bir alıştırmadır.`},{id:`t-pratik-2`,fromMonths:9,toMonths:12,category:`beslenme`,title:`3 öğün + ara öğün`,body:`9–11 ay arasında günde 3 ana öğün ve 1–2 sağlıklı ara öğün hedeflenir. Ara öğünler: meyve, yoğurt, sebze çubukları, peynirli ekmek.`,source:`who2023`},{id:`t-pratik-3`,fromMonths:9,toMonths:18,category:`taktik`,title:`Biberondan bardağa`,body:`Açık bardak kullanımı diş sağlığı ve konuşma gelişimi için faydalıdır. 12–18 ay arasında biberonu tamamen bırakmayı hedefleyin.`,source:`aap`},{id:`t-pratik-4`,fromMonths:9,toMonths:24,category:`taktik`,title:`Bölünmüş sorumluluk`,body:`Ebeveyn ne, ne zaman ve nerede yeneceğine karar verir; çocuk ne kadar ve yiyip yemeyeceğine karar verir. Ellyn Satter'in bu yaklaşımı yemek savaşlarını büyük ölçüde azaltır.`},{id:`t-pratik-5`,fromMonths:9,toMonths:24,category:`mit`,title:`Rüşvet ve ödül yok`,body:`'Sebzeni bitirirsen tatlı var' demek sebzeyi ceza, tatlıyı ödül yapar. Tatlıyı da sıradan bir yemek gibi, ara sıra ve küçük porsiyon olarak sunun.`},{id:`t-pratik-6`,fromMonths:9,toMonths:12,category:`beslenme`,title:`Alerjenleri menüde tutun`,body:`Tanıştırdığınız alerjenleri haftada 2–3 kez vermeye devam edin. Düzenli maruziyet toleransın sürmesine yardım eder.`,source:`naiad`},{id:`t-pratik-7`,fromMonths:9,toMonths:24,category:`taktik`,title:`Dağınıklık öğrenmenin parçası`,body:`Ellerle oynamak, yemeği ezmek, saçlara sürmek — hepsi duyusal keşif. Yerde örtü, kolay temizlenen önlük ve bolca sabır. Yemek sırasında sürekli silmek bebeği rahatsız edebilir.`},{id:`t-pratik-8`,fromMonths:9,toMonths:12,category:`guvenlik`,title:`Diş fırçalama başladı mı?`,body:`İlk diş çıktığı andan itibaren günde 2 kez pirinç tanesi kadar florürlü diş macunuyla fırçalayın. Yemek sonrası şekerli besinlerden kaçının.`},{id:`t-aile-1`,fromMonths:12,toMonths:24,category:`beslenme`,title:`İnek sütüne geçiş`,body:`12. aydan itibaren tam yağlı inek sütü açık bardaktan verilebilir. Günde ~400–500 ml'yi aşmayın; fazla süt iştahı ve demir emilimini azaltır.`,source:`cdc`},{id:`t-aile-2`,fromMonths:12,toMonths:24,category:`beslenme`,title:`Tuz hâlâ az`,body:`1–3 yaş için günlük tuz 2 gramın altında olmalı. Yemeklerin tuzunu bebeğin porsiyonunu ayırdıktan sonra ekleyin; turşu, salamura, cips, hazır çorba gibi tuzlu besinleri sınırlayın.`,source:`nhs`},{id:`t-aile-3`,fromMonths:12,toMonths:24,category:`taktik`,title:`Ekransız sofra`,body:`Yemekte tablet/TV, çocuğun tokluk sinyallerini fark etmesini zorlaştırır ve aşırı ya da yetersiz yemeye yol açabilir. Birlikte, sohbet ederek yemek en iyi öğretmendir.`},{id:`t-aile-4`,fromMonths:12,toMonths:24,category:`gelisim`,title:`Yemek seçiciliği normaldir`,body:`18 ay civarında bilinen yiyecekleri tercih etme (neofobi) artar. Bu bir gelişim evresidir. Her öğünde sevdiği bir besin + yeni bir besin sunun, baskı yapmayın.`},{id:`t-aile-5`,fromMonths:12,toMonths:24,category:`beslenme`,title:`Meyve suyu yerine meyve`,body:`Meyve suyu lifsizdir, şeker yükü yüksektir. 1–3 yaşta en fazla günde 120 ml %100 meyve suyu; ama asıl öneri meyvenin kendisini yemesi.`,source:`aap`},{id:`t-aile-6`,fromMonths:12,toMonths:24,category:`guvenlik`,title:`Yürürken yemek yok`,body:`Koşarken, oynarken veya arabada yemek boğulma riskini artırır. Yemek her zaman otururken ve bir yetişkinin gözetiminde.`},{id:`t-aile-7`,fromMonths:12,toMonths:24,category:`taktik`,title:`Mutfakta küçük yardımcı`,body:`Sebze yıkamak, yoğurt karıştırmak, sofraya peçete koymak... Yemeğin hazırlanmasına katılan çocuk o yemeği tatmaya çok daha isteklidir.`},{id:`t-aile-8`,fromMonths:12,toMonths:24,category:`beslenme`,title:`Balık haftada 2 kez`,body:`1 yaş sonrası her porsiyon yaklaşık 30 g olmak üzere haftada 2 kez düşük cıvalı balık (somon, hamsi, sardalya, levrek, çipura) önerilir.`,source:`fda`},{id:`t-gen-1`,fromMonths:6,toMonths:24,category:`beslenme`,title:`Anne sütü devam`,body:`Ek gıdaya başlamak emzirmeyi bırakmak demek değildir. WHO anne sütünün 2 yaş ve sonrasına kadar sürdürülmesini öneriyor.`,source:`who2023`},{id:`t-gen-2`,fromMonths:6,toMonths:24,category:`taktik`,title:`Tokluk işaretlerine saygı`,body:`Başını çevirmek, ağzını kapatmak, kaşığı itmek, yemekle oynamaya başlamak 'doydum' demektir. Bir kaşık daha için ısrar etmeyin.`},{id:`t-gen-3`,fromMonths:6,toMonths:24,category:`guvenlik`,title:`Yeni besin sonrası izleyin`,body:`Kızarıklık, kurdeşen, dudak/göz şişmesi, kusma veya ishal görürseniz o besini kesip doktorunuza danışın. Nefes darlığı, hırıltı, solukluk veya halsizlik ACİL durumdur: 112'yi arayın.`},{id:`t-gen-4`,fromMonths:6,toMonths:24,category:`beslenme`,title:`Bitki çayları yok`,body:`Rezene, ıhlamur, papatya gibi bitki çayları bebeklere önerilmez. Bazı bitkiler bebekler için zararlı maddeler içerebilir ve süt alımının yerini alır.`},{id:`t-gen-5`,fromMonths:6,toMonths:24,category:`taktik`,title:`Rengarenk tabak`,body:`Her gün farklı renklerden besin sunmayı hedefleyin: turuncu (havuç), yeşil (brokoli), kırmızı (domates), mor (patlıcan), beyaz (karnabahar). Farklı renk = farklı fitokimyasal.`},{id:`t-gen-6`,fromMonths:6,toMonths:24,category:`beslenme`,title:`Pirinci dönüşümlü kullanın`,body:`Pirinç topraktan arsenik biriktirir. Bol suda pişirip suyunu dökmek arseniği azaltır; ayrıca yulaf, bulgur, karabuğday ile dönüşümlü kullanın. Pirinç sütü 5 yaş altına önerilmez.`,source:`nhs`},{id:`t-gen-7`,fromMonths:6,toMonths:24,category:`guvenlik`,title:`Hijyen`,body:`Ellerinizi yıkayın, çiğ et ve sebze için ayrı kesme tahtası kullanın, et/tavuk/balık/yumurtayı tamamen pişirin. Bebeklerin bağışıklık sistemi gıda kaynaklı enfeksiyonlara daha duyarlıdır.`}],At=[{id:`m-1`,myth:`Yumurtanın önce sarısı verilmeli, akı 1 yaşından sonra.`,truth:`Güncel rehberler (AAP, NHS, ESPGHAN) bütün yumurtanın iyice pişmiş olarak 6. aydan itibaren verilebileceğini söylüyor. Alerjenleri geciktirmek alerjiyi önlemez.`,source:`aap`},{id:`m-2`,myth:`Pekmez bebeklerin demir ihtiyacını karşılar.`,truth:`Pekmezin demiri düşük biyoyararlanımlıdır ve yoğun şeker içerir. Demir için et, tavuk, yumurta, mercimek ve demirle zenginleştirilmiş tahıllar çok daha etkilidir.`},{id:`m-3`,myth:`Bebek yemeğine biraz tuz koymazsam yemez.`,truth:`Bebekler tuzlu tada doğuştan bağımlı değildir; tuzsuz yemeğe kolayca alışırlar. 1 yaş altında böbrekler fazla tuzu kaldıramaz. Lezzet için baharat ve yeşillik kullanın.`,source:`nhs`},{id:`m-4`,myth:`Alerjen besinleri 1 yaşına kadar vermemek gerekir.`,truth:`Tam tersi! Yer fıstığı ve yumurta gibi alerjenleri 4–6. aydan sonra erken tanıştırmak alerji riskini azaltabilir. Şiddetli egzaması olan bebeklerde önce doktora danışın.`,source:`naiad`},{id:`m-5`,myth:`Ek gıdaya meyve suyuyla başlanmalı.`,truth:`AAP 1 yaş altına meyve suyu önermez. Meyve suyu lifsizdir, şeker yükü yüksektir ve diş çürüğü riskini artırır. Meyvenin kendisini verin.`,source:`aap`},{id:`m-6`,myth:`Ispanak 1 yaşından önce kesinlikle verilmez.`,truth:`EFSA'ya göre 6–12 ay arasında karışımlar içinde ıspanak tüketimi sağlık sorunu oluşturmaz. Önemli olan: ana sebze yapmamak, taze hazırlamak ve tekrar tekrar ısıtmamak.`,source:`efsa`},{id:`m-7`,myth:`Diş çıkmadan parmak besin verilmez.`,truth:`Bebekler diş etleriyle şaşırtıcı derecede güçlü ezebilir. Yumuşak, iki parmak arasında ezilebilen parmak besinler 6. aydan itibaren dişsiz bebeklere de uygundur.`,source:`bliss`},{id:`m-8`,myth:`Bebek yemeği reddederse o besini sevmiyordur.`,truth:`Bir besinin kabulü için 8–15 tekrar gerekebilir. İlk 'yüz buruşturma' çoğunlukla yeni tada şaşırmadır, reddetme değil.`},{id:`m-9`,myth:`Ek gıdayla birlikte emzirmeyi azaltmak gerekir.`,truth:`6–12 ay arasında süt hâlâ temel besin kaynağıdır. Ek gıda süte eklenir, onun yerini almaz. WHO emzirmenin 2 yaş ve sonrasına kadar sürmesini önerir.`,source:`who2023`},{id:`m-10`,myth:`Rezene çayı bebeğin gazına iyi gelir, bol bol içirilmeli.`,truth:`Bitki çayları bebeklere önerilmez; bazı bitkiler bebekler için riskli bileşikler içerir ve süt alımının yerini alır. Gaz sorunları için çocuk doktorunuza danışın.`},{id:`m-11`,myth:`Kaşıkla beslemek BLW'den daha güvenlidir.`,truth:`Çalışmalar, güvenlik kurallarına uyulduğunda (BLISS gibi) BLW'de boğulma riskinin kaşıkla beslenmeden farklı olmadığını gösteriyor. Asıl önemli olan besinin şekli ve dokusu.`,source:`bliss`},{id:`m-12`,myth:`Bebeklere yağ verilmemeli, kilo alır.`,truth:`Bebekler enerjilerinin yaklaşık yarısını yağdan alır ve beyin gelişimi için yağa ihtiyaç duyar. Pürelere zeytinyağı veya tereyağı eklemek tavsiye edilir.`}]})),Mt,Nt=t((()=>{Mt=[{id:`hazir-mi`,title:`Bebeğim ek gıdaya hazır mı?`,emoji:`🚦`,category:`baslangic`,minutes:3,summary:`Takvimden çok bebeğinizin gelişim işaretlerine bakın.`,sources:[`who2023`,`espghan`,`nhs`],sections:[{paragraphs:[`Dünya Sağlık Örgütü ve ESPGHAN, ek gıdaya yaklaşık 6. ayda başlanmasını öneriyor. 4. aydan (17 hafta) önce başlanmamalı, 6. aydan sonraya da ertelenmemelidir. Ancak her bebek farklıdır; aşağıdaki üç işaretin birlikte görülmesi önemlidir.`]},{heading:`Üç temel işaret`,bullets:[`Desteksiz veya az destekle dik oturabiliyor ve başını sabit tutabiliyor.`,`Yiyeceğe bakıp, onu tutup ağzına kendisi götürebiliyor (el-göz-ağız koordinasyonu).`,`Yiyeceği diliyle dışarı itmek yerine yutabiliyor (dil itme refleksi azalmış).`]},{heading:`Hazırlık işareti OLMAYANLAR`,bullets:[`Yumruğunu emmek`,`Geceleri daha sık uyanmak`,`Daha sık emmek istemek (genellikle büyüme atağıdır)`,`Sizi yerken izlemek`]},{heading:`Prematüre bebekler`,callout:{tone:`info`,text:`Erken doğan bebeklerde ek gıda zamanlaması düzeltilmiş yaşa ve bireysel gelişime göre belirlenir. Uygulama, gebelik haftasını girerseniz düzeltilmiş yaşı kullanır — yine de başlangıç zamanını mutlaka çocuk doktorunuzla planlayın.`}}]},{id:`ilk-hafta`,title:`İlk 2 hafta: Adım adım başlangıç planı`,emoji:`🗓️`,category:`baslangic`,minutes:4,summary:`Ne zaman, ne kadar, hangi sırayla? Kafa karışıklığını bitiren plan.`,sources:[`nhs`,`who2023`,`aap`],sections:[{heading:`Gün 1–3`,bullets:[`Günde 1 öğün, keyifli olduğu bir saatte (genellikle öğle).`,`Tek malzemeli sebze püresi veya yumuşak sebze çubuğu: kabak, brokoli, tatlı patates.`,`1–2 çay kaşığı yeterli. Yemezse sorun değil.`]},{heading:`Gün 4–7`,bullets:[`Demir kaynağı ekleyin: mercimek püresi veya etli sebze püresi.`,`Yeni bir sebze daha: bezelye, karnabahar.`,`İlk alerjen: iyi pişmiş yumurta (sabah saatinde).`]},{heading:`Gün 8–14`,bullets:[`Günde 2 öğüne çıkın.`,`Yoğurt, fıstık ezmesi, tahin gibi alerjenleri 2–3 gün arayla birer birer ekleyin.`,`Meyveleri de tanıştırın: armut, muz, avokado.`,`Kıvamı yavaş yavaş koyulaştırın.`]},{callout:{tone:`ok`,text:`Bu dönemde bebeğinizin ne kadar yediği değil, deneyimi önemlidir. Süt (anne sütü/mama) hâlâ ana besin kaynağıdır.`}}]},{id:`bogulma-ilk-yardim`,title:`Öğürme mi, boğulma mı? İlk yardım`,emoji:`🆘`,category:`guvenlik`,minutes:4,summary:`Her ebeveynin bilmesi gereken hayati fark ve ilk yardım adımları.`,sources:[`cdc`,`nhs`],sections:[{heading:`Öğürme (normal, koruyucu refleks)`,bullets:[`Gürültülüdür: öksürük, öğürme sesi`,`Yüz kızarabilir, gözler sulanabilir, dil dışarı çıkar`,`Bebek kendi kendine çözer`,`Yapılacak: SAKİN kalın, müdahale etmeyin, parmağınızı ağzına sokmayın`]},{heading:`Boğulma (ACİL)`,bullets:[`Sessizdir ya da tiz, hırıltılı ses`,`Ağlayamaz, öksüremez, nefes alamaz`,`Dudaklar/yüz morarır veya solar`,`Panik ifadesi`]},{heading:`1 yaş altı bebekte ilk yardım`,steps:[`112'yi arayın (ya da birine arattırın).`,`Bebeği yüzüstü, başı gövdesinden aşağıda olacak şekilde ön kolunuza yatırın; çenesini elinizle destekleyin.`,`Avuç içi topuğuyla kürek kemikleri arasına 5 kez sert vuruş yapın.`,`Çıkmazsa bebeği sırtüstü çevirin; göğüs ortasına (meme başı hizasının hemen altı) iki parmakla 5 kez bastırın.`,`Cisim çıkana veya ekip gelene kadar 5 sırt vuruşu + 5 göğüs basısını sürdürün.`,`Bebek bilincini kaybederse temel yaşam desteğine (CPR) başlayın.`]},{callout:{tone:`danger`,text:`Ağza kör parmakla girip cisim aramayın — cismi daha derine itebilirsiniz. Ek gıdaya başlamadan önce bebek ilk yardım kursuna katılmanızı öneririz.`}}]},{id:`yasak-besinler`,title:`1 yaş altında verilmeyecekler`,emoji:`🚫`,category:`guvenlik`,minutes:3,summary:`Kısa ama hayati liste.`,sources:[`cdc`,`nhs`,`aap`,`fda`],sections:[{bullets:[`🍯 Bal (pişmiş olsa bile) — bebek botulizmi riski.`,`🧂 Eklenmiş tuz — böbrekler kaldıramaz; < 1 g/gün.`,`🍬 Eklenmiş şeker, şekerli içecekler, şekerlemeler.`,`🥛 İçecek olarak inek sütü — pişirmede az miktar olur.`,`🧃 Meyve suyu, gazlı içecek, çay, kahve, bitki çayları.`,`🥚 Çiğ veya az pişmiş yumurta (yumuşak haşlanmış, ev yapımı mayonez).`,`🧀 Pastörize edilmemiş süt ürünleri.`,`🐟 Yüksek cıvalı balıklar: köpek balığı, kılıç balığı, marlin, büyük ton balığı.`,`🦪 Çiğ deniz ürünleri.`,`🍚 Pirinç sütü (5 yaş altı).`,`🥓 İşlenmiş et: sucuk, salam, sosis (tuz ve nitrit).`]},{heading:`Boğulma riski yüksek besinler`,bullets:[`Bütün yemişler, fıstık (5 yaşına kadar)`,`Bütün üzüm, çeri domates, zeytin — uzunlamasına dörde bölün`,`Çiğ havuç, çiğ elma — rendeleyin veya pişirin`,`Patlamış mısır, sert şeker, sakız`,`Kaşıktan kalın fıstık ezmesi`,`Bütün nohut, bütün bezelye (küçük bebeklerde)`,`Sosis (yuvarlak dilim halinde özellikle tehlikeli)`]}]},{id:`demir`,title:`Demir: 6. aydan sonra en kritik besin`,emoji:`🩸`,category:`beslenme`,minutes:4,summary:`Neden önemli, nereden alınır, emilimi nasıl artırılır?`,sources:[`who2023`,`espghan`,`bliss`,`saglikbak`],sections:[{paragraphs:[`Bebekler anne karnından getirdikleri demir depolarını yaklaşık 6. ayda tüketmeye başlar. Bu dönemde demir ihtiyacı, kilogram başına yaşamın hiçbir döneminde olmadığı kadar yüksektir. Demir eksikliği beyin gelişimini olumsuz etkileyebilir.`]},{heading:`En iyi kaynaklar`,bullets:[`Hem demir (en iyi emilen): kırmızı et, tavuk but, ciğer (haftada 1), balık, yumurta`,`Bitkisel demir: kırmızı/yeşil mercimek, nohut, fasulye, tahin, yulaf, ıspanak, karabuğday`,`Demirle zenginleştirilmiş bebek tahılları`]},{heading:`Emilimi artıran ipuçları`,bullets:[`Bitkisel demiri C vitaminiyle eşleştirin: domates, kırmızı biber, brokoli, portakal, limon.`,`Et + bakliyat birlikte: et, bitkisel demirin emilimini de artırır.`,`Demirli öğünle birlikte büyük miktarda süt/peynir vermeyin; kalsiyum emilimi azaltabilir.`,`Her öğünde bir demir kaynağı hedefleyin (BLISS yaklaşımı).`]},{callout:{tone:`info`,text:`Türkiye'de 'Demir Gibi Türkiye' programıyla 4–12 ay arası bebeklere demir desteği verilir. Çocuk doktorunuzun önerdiği takviyeyi sürdürün.`}}]},{id:`alerjen-rehberi`,title:`Alerjen tanıştırma rehberi`,emoji:`🥜`,category:`beslenme`,minutes:5,summary:`Erken, tek tek ve düzenli: alerjiden korunmanın bilimsel yolu.`,sources:[`aap`,`naiad`,`espghan`],sections:[{paragraphs:[`Eskiden alerjen besinlerin geciktirilmesi önerilirdi. Bugün ise LEAP gibi büyük çalışmalar sayesinde erken tanıştırmanın, özellikle yer fıstığı alerjisi riskini anlamlı ölçüde azalttığını biliyoruz.`]},{heading:`Altın kurallar`,steps:[`Bebek birkaç farklı katı gıdayı sorunsuz yedikten sonra başlayın (6. ay civarı).`,`Bebek sağlıklıyken, günün erken saatinde ve evdeyken verin.`,`Küçük miktarla (¼ çay kaşığı) başlayın, 10 dakika izleyin, sorun yoksa porsiyonu tamamlayın.`,`Bir seferde yalnızca BİR yeni alerjen. Yeni alerjenler arasında 2–3 gün bırakın.`,`Tolere edilen alerjeni menüden ÇIKARMAYIN: haftada 2–3 kez vermeye devam edin.`]},{heading:`Reaksiyon belirtileri`,bullets:[`Hafif: ağız çevresinde kızarıklık, birkaç kurdeşen → besini kesin, doktorunuza danışın.`,`Ciddi: yaygın kurdeşen, dudak/dil şişmesi, tekrarlayan kusma, öksürük, hırıltı, nefes darlığı, solukluk, halsizlik → HEMEN 112.`]},{callout:{tone:`warn`,text:`Şiddetli egzaması veya bilinen yumurta alerjisi olan bebekler yer fıstığı alerjisi açısından yüksek risklidir. Bu bebeklerde yer fıstığını 4–6. ayda, ancak ÖNCE doktor değerlendirmesi ve gerekirse alerji testi ile tanıştırın.`}}]},{id:`blw-puree`,title:`BLW mi, püre mi, karma mı?`,emoji:`⚖️`,category:`taktik`,minutes:4,summary:`Her yöntemin artıları, eksileri ve güvenli uygulama ipuçları.`,sources:[`bliss`,`nhs`],sections:[{heading:`Kaşıkla (püre)`,bullets:[`Artı: Ne kadar yediğini görmek kolay, demir zengini besinleri vermek pratik.`,`Dikkat: Pütürlü dokulara 9. aydan önce geçin; tokluk işaretlerine saygı gösterin.`]},{heading:`Bebek liderliğinde (BLW)`,bullets:[`Artı: Kendi iştahını düzenler, ince motor becerileri gelişir, aile sofrasına erken katılır.`,`Dikkat: Klasik BLW'de demir ve enerji alımı düşük kalabilir. Her öğünde bir demir kaynağı + bir enerji kaynağı sunun (BLISS).`,`Besinler parmak boyunda ve iki parmak arasında ezilecek yumuşaklıkta olmalı.`]},{heading:`Karma yöntem`,bullets:[`Pek çok ailenin tercihi: Kaşıkla demirli püreler + yanında parmak besinler.`,`Önceden yüklenmiş kaşık, iki dünyanın en iyisidir.`]},{callout:{tone:`ok`,text:`Doğru yöntem, ailenize uyan ve güvenlik kurallarına uyduğunuz yöntemdir. Uygulama tercihinize göre tarif önerir.`}}]},{id:`duyarli-beslenme`,title:`Duyarlı beslenme: Açlık ve tokluk dili`,emoji:`💬`,category:`taktik`,minutes:3,summary:`Bebeğiniz konuşamaz ama ne istediğini size söyler.`,sources:[`who2023`],sections:[{heading:`Açlık işaretleri`,bullets:[`Kaşığa uzanır, ağzını açar`,`Yemeği görünce heyecanlanır`,`Yemeği işaret eder`]},{heading:`Tokluk işaretleri`,bullets:[`Başını çevirir`,`Ağzını sıkıca kapatır`,`Kaşığı/yemeği iter`,`Yemekle oynamaya, atmaya başlar`,`Mama sandalyesinden çıkmak ister`]},{heading:`Yapılmaması gerekenler`,bullets:[`Uçak-tren oyunuyla 'kandırmak'`,`Dikkati dağıtıp (ekran) ağza yemek koymak`,`Bir kaşık daha, son kaşık ısrarı`,`Yemeği ödül veya ceza olarak kullanmak`]}]},{id:`secici-yeme`,title:`Yemek seçen bebek için 10 taktik`,emoji:`🧩`,category:`sorun`,minutes:4,summary:`Baskı yapmadan çeşitliliği artırmanın kanıtlanmış yolları.`,sources:[`espghan`],sections:[{steps:[`Her öğünde 'güvenli' (sevdiği) bir besin + yeni bir besin koyun.`,`Yeni besini çok küçük porsiyonda sunun; tabakta görmek bile bir maruziyettir.`,`8–15 kez tekrar edin — farklı günlerde, farklı şekillerde (çubuk, püre, köfte).`,`Siz de aynı yemekten yiyin ve keyifle yediğinizi gösterin.`,`Sabit öğün saatleri belirleyin; aralarda sürekli atıştırma iştahı kapatır.`,`Süt miktarını kontrol edin: 1 yaş sonrası fazla süt (>500 ml) iştahı azaltır.`,`Yemek süresini 20–30 dakika ile sınırlayın, sonra sakince kaldırın.`,`Övgüyü yemeğe değil davranışa yapın: 'Brokoliye dokundun, harika keşif!'`,`Mutfağa davet edin: yıkama, karıştırma, sofrayı kurma.`,`Tadına bakmaya zorlamayın — 'tatmak zorunda değilsin, tabakta durabilir.'`]},{callout:{tone:`warn`,text:`Kilo alımında duraklama, 20'den az besin kabul etme, öğürerek yiyeceği tamamen reddetme gibi durumlar beslenme bozukluğuna işaret edebilir — çocuk doktorunuza danışın.`}}]},{id:`kabizlik`,title:`Ek gıdayla gelen kabızlık`,emoji:`🚽`,category:`sorun`,minutes:3,summary:`Çok yaygın, genellikle basit önlemlerle geçer.`,sources:[`nhs`],sections:[{paragraphs:[`Katı gıdaya geçişte dışkı kıvamının ve sıklığının değişmesi normaldir. Sert, ağrılı, topak topak dışkı kabızlığa işaret eder.`]},{heading:`Yardımcı olabilecekler`,bullets:[`Öğünlerle birlikte su sunun.`,`'P' meyveleri: erik (kuru erik püresi), armut, şeftali.`,`Lifli besinler: yulaf, mercimek, sebzeler.`,`Muz, pirinç ve elma püresini bir süre azaltın.`,`Bisiklet çevirme hareketi ve karın masajı.`]},{callout:{tone:`warn`,text:`Dışkıda kan, şişkin karın, kusma, kilo kaybı veya 1 haftayı aşan kabızlıkta doktora başvurun.`}}]},{id:`saklama`,title:`Hazırlama, dondurma ve saklama`,emoji:`❄️`,category:`taktik`,minutes:3,summary:`Haftada bir saat mutfakta, haftanın geri kalanı rahat.`,sources:[`nhs`],sections:[{heading:`Saklama süreleri`,bullets:[`Buzdolabı: sebze/meyve püreleri 48 saat; et, tavuk, balık, yumurta içerenler 24 saat.`,`Derin dondurucu: püreler ve köfteler 1 ay (en iyi lezzet ve besin değeri için).`,`Pişen yemeği 1–2 saat içinde soğutup buzdolabına kaldırın.`]},{heading:`Çözdürme ve ısıtma`,bullets:[`Buzdolabında bir gece önceden çözdürün (oda sıcaklığında değil).`,`Bir kez, buharı tütene kadar iyice ısıtın; karıştırıp ılıyınca verin.`,`Mikrodalgada sıcak noktalar oluşur — iyice karıştırıp sıcaklığı kontrol edin.`,`Isıtılmış yemeği tekrar ısıtmayın; çözülmüş yemeği tekrar dondurmayın.`]},{heading:`Buz kalıbı yöntemi`,paragraphs:[`Püreleri silikon buz kalıplarına dökün, donunca kilitli poşete aktarıp tarih yazın. Her küp yaklaşık 1–2 yemek kaşığıdır; farklı küpleri birleştirerek her gün yeni kombinasyonlar yaratın.`]}]},{id:`hasta-gun`,title:`Hasta, iştahsız ve diş çıkaran günler`,emoji:`🤒`,category:`sorun`,minutes:3,summary:`İştah düştüğünde ne yapmalı?`,sources:[`who2023`],sections:[{bullets:[`Hastalık sırasında sık sık emzirin/mama verin ve sıvı alımını artırın.`,`Sevdiği, yumuşak ve kolay yutulan besinler sunun: yoğurt, çorba, püre.`,`Zorlamayın; iştah genellikle iyileşme sonrası 'telafi' eder (WHO: hastalık sonrası birkaç hafta ek öğün önerilir).`,`Diş çıkarırken soğuk besinler: donmuş yoğurt damlaları, soğutulmuş salatalık çubukları.`]},{callout:{tone:`danger`,text:`Az ıslak bez (6 saatten uzun kuru bez), çökük bıngıldak, uyuşukluk, yüksek ateş veya içememe durumunda hemen doktora başvurun.`}}]},{id:`vejetaryen`,title:`Vejetaryen ailelerde bebek beslenmesi`,emoji:`🌱`,category:`beslenme`,minutes:3,summary:`Mümkün — ama planlı olmalı.`,sources:[`who2023`,`espghan`],sections:[{paragraphs:[`WHO, 6–8 ay arasında hayvansal gıdalar olmadan demir, çinko ve B12 ihtiyacının karşılanmasının çok zor olduğunu belirtiyor. Yumurta ve süt ürünleri tüketen (lakto-ovo) vejetaryen beslenme dikkatle planlanabilir; vegan beslenme ise mutlaka uzman eşliğinde ve takviyelerle yapılmalıdır.`]},{heading:`Dikkat edilecek besinler`,bullets:[`Demir: mercimek, nohut, tahin, yulaf + her öğünde C vitamini`,`Çinko: bakliyat, tam tahıllar, yemiş ezmeleri`,`B12: yumurta, süt ürünleri; veganlarda takviye ŞART`,`Omega-3: öğütülmüş keten tohumu, ceviz (ezme/öğütülmüş)`,`Protein ve enerji: tahin, fıstık ezmesi, avokado, zeytinyağı`]},{callout:{tone:`warn`,text:`Vegan beslenen bebekler için çocuk doktoru ve diyetisyen takibi şiddetle önerilir.`}}]}]})),Pt,Ft,It=t((()=>{St(),wt(),Et(),ie(),Ot(),jt(),Nt(),Pt=[...xt,...Ct,...Tt],Ft=Object.fromEntries(Pt.map(e=>[e.id,e]))}));function Lt(e){let t=2166136261;for(let n=0;n<e.length;n++)t^=e.charCodeAt(n),t=Math.imul(t,16777619);return t>>>0}function Rt(e){let t=e>>>0;return()=>{t=t+1831565813>>>0;let e=t;return e=Math.imul(e^e>>>15,e|1),e^=e+Math.imul(e^e>>>7,e|61),((e^e>>>14)>>>0)/4294967296}}function zt(e,t,n){let r=e.map(e=>Math.max(0,t(e))),i=r.reduce((e,t)=>e+t,0);if(i<=0)return;let a=n()*i;for(let t=0;t<e.length;t++)if(a-=r[t],a<0)return e[t];return e[e.length-1]}var Bt=t((()=>{}));function Vt(e){return{id:e.id,title:e.title,emoji:e.emoji,summary:e.summary,minAgeMonths:e.minAgeMonths,meals:e.meals,textures:e.textures,methods:e.methods,prepMinutes:e.prepMinutes,cookMinutes:e.cookMinutes,nutrients:e.nutrients,allergens:e.allergens,tags:e.tags,introducesAllergen:e.introduc
